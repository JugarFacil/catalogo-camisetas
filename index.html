<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Camisetas</title>
    <style>
        :root {
            --primary: #111111;
            --accent: #25D366;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333333;
            --gray: #666666;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.9rem;
            color: #ccc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .filter-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card-img-wrapper {
            position: relative;
            cursor: pointer;
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #eee;
            display: block;
        }
        .photo-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            pointer-events: none;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .version {
            font-size: 0.8rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 10px;
        }
        .sizes {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .size-badge {
            border: 1px solid #ccc;
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            color: var(--gray);
        }
        .whatsapp-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        .whatsapp-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }

        /* MODAL / VISOR DE GALERÍA DE FOTOS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            font-size: 24px;
            padding: 12px 16px;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }
        .modal-counter {
            color: white;
            margin-top: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo de Camisetas</h1>
        <p>Selecciona tu modelo y encárgalo al instante por WhatsApp</p>
    </header>

    <div class="container">
        <!-- Filtros rápidos por talle -->
        <div class="filters">
            <button class="filter-btn active" onclick="filtrarTalle('todos')">Todos</button>
            <button class="filter-btn" onclick="filtrarTalle('S')">Talle S</button>
            <button class="filter-btn" onclick="filtrarTalle('M')">Talle M</button>
            <button class="filter-btn" onclick="filtrarTalle('L')">Talle L</button>
            <button class="filter-btn" onclick="filtrarTalle('XL')">Talle XL</button>
        </div>

        <!-- Grilla de Camisetas -->
        <div class="grid" id="product-grid"></div>
    </div>

    <!-- Modal Visor de Fotos -->
    <div class="modal" id="gallery-modal">
        <span class="close-btn" onclick="cerrarGaleria()">&times;</span>
        <button class="nav-btn prev-btn" onclick="cambiarFoto(-1)">&#10094;</button>
        <div class="modal-content">
            <img id="modal-img" src="" alt="Foto de camiseta">
        </div>
        <button class="nav-btn next-btn" onclick="cambiarFoto(1)">&#10095;</button>
        <div class="modal-counter" id="modal-counter">1 / 1</div>
    </div>

    <script>
        // TUS DOS NÚMEROS DE WHATSAPP (reemplaza las X con tus números reales)
        const numero1 = "5493813038910"; 
        const numero2 = "5493813491117"; 

        // LISTA DE CAMISETAS CON MÚLTIPLES IMÁGENES
        const camisetas = [
            {
                id: 1,
                nombre: "Argentina Titular 3 Estrellas",
                version: "Versión Jugador",
                precio: 45000,
                talles: ["M", "L", "XL"],
                imagenes: [
                    "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80",
                    "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=600&q=80"
                ]
            },
            {
                id: 2,
                nombre: "Real Madrid Local",
                version: "Versión Hincha",
                precio: 42000,
                talles: ["S", "M", "L"],
                imagenes: [
                    "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=600&q=80"
                ]
            },
            {
                id: 3,
                nombre: "Barcelona Visitante",
                version: "Versión Jugador",
                precio: 42000,
                talles: ["L", "XL"],
                imagenes: [
                    "https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=600&q=80"
                ]
            }
        ];

        let imagenesActuales = [];
        let indiceFotoActual = 0;

        function mostrarCamisetas(talleFiltro = 'todos') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            camisetas.forEach(c => {
                if (talleFiltro !== 'todos' && !c.talles.includes(talleFiltro)) {
                    return; 
                }

                const mensaje = `Hola! Me interesa la camiseta ${c.nombre} (${c.version}). El precio publicado es de $${c.precio}. ¿Sigue disponible?`;
                const linkWp1 = `https://wa.me/${numero1}?text=${encodeURIComponent(mensaje)}`;
                const linkWp2 = `https://wa.me/${numero2}?text=${encodeURIComponent(mensaje)}`;
                const fotoPrincipal = c.imagenes[0];
                const cantidadFotos = c.imagenes.length;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper" onclick="abrirGaleria(${c.id})">
                        <img src="${fotoPrincipal}" alt="${c.nombre}">
                        <div class="photo-badge">📷 ${cantidadFotos} foto${cantidadFotos > 1 ? 's' : ''} (Ver)</div>
                    </div>
                    <div class="card-body">
                        <div class="title">${c.nombre}</div>
                        <div class="version">${c.version}</div>
                        <div class="price">$${c.precio.toLocaleString()}</div>
                        <div class="sizes">
                            ${c.talles.map(t => `<span class="size-badge">${t}</span>`).join('')}
                        </div>
                        <div class="whatsapp-container">
                            <a href="${linkWp1}" target="_blank" class="whatsapp-btn">
                                💬 Pedir al WhatsApp 1
                            </a>
                            <a href="${linkWp2}" target="_blank" class="whatsapp-btn" style="background-color: #128C7E;">
                                💬 Pedir al WhatsApp 2
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarTalle(talle) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            mostrarCamisetas(talle);
        }

        function abrirGaleria(idProducto) {
            const prod = camisetas.find(c => c.id === idProducto);
            if (!prod || !prod.imagenes.length) return;

            imagenesActuales = prod.imagenes;
            indiceFotoActual = 0;
            actualizarModal();
            document.getElementById('gallery-modal').classList.add('active');
        }

        function cerrarGaleria() {
            document.getElementById('gallery-modal').classList.remove('active');
        }

        function cambiarFoto(direccion) {
            indiceFotoActual += direccion;
            if (indiceFotoActual < 0) {
                indiceFotoActual = imagenesActuales.length - 1;
            } else if (indiceFotoActual >= imagenesActuales.length) {
                indiceFotoActual = 0;
            }
            actualizarModal();
        }

        function actualizarModal() {
            document.getElementById('modal-img').src = imagenesActuales[indiceFotoActual];
            document.getElementById('modal-counter').innerText = `${indiceFotoActual + 1} / ${imagenesActuales.length}`;
        }

        mostrarCamisetas();
    </script>
</body>
</html>
