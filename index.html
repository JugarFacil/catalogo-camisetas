<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugar Fácil - Catálogo</title>
    <style>
        :root {
            --primary: #111111;
            --accent: #25D366;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333333;
            --gray: #666666;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.9rem;
            color: #ccc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        
        /* BOTONES DE CATEGORÍA PRINCIPAL */
        .main-categories {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 10px 0;
        }
        .cat-btn {
            background: #e0e0e0;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active {
            background: var(--primary);
            color: white;
        }

        /* FILTROS Y SUBCATEGORÍAS */
        .filters-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .filter-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card-img-wrapper {
            position: relative;
            cursor: pointer;
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #eee;
            display: block;
        }
        .photo-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            pointer-events: none;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .version {
            font-size: 0.8rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 10px;
        }
        .sizes {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .size-badge {
            border: 1px solid #ccc;
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            color: var(--gray);
        }
        .on-order {
            font-size: 0.85rem;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 15px;
        }
        .whatsapp-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        .whatsapp-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }

        /* MODAL / VISOR DE GALERÍA DE FOTOS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            font-size: 24px;
            padding: 12px 16px;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }
        .modal-counter {
            color: white;
            margin-top: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>

        </div>

        <!-- Grilla de Productos -->

    </div>

        function cambiarCategoriaPrincipal(cat) {
            categoriaPrincipalActual = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${cat}`).classList.add('active');

            const subcatContainer = document.getElementById('subcategories-container');
            if (cat === 'shorts') {
                subcatContainer.style.display = 'none';
            } else {
                subcatContainer.style.display = 'flex';
            }

            subcategoriaActual = 'todas';
            talleActual = 'todos';
            resetearFiltrosUI();
            renderizarProductos();
        }

        function filtrarSubcategoria(subcat) {
            subcategoriaActual = subcat;
            document.querySelectorAll('.subcat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderizarProductos();
        }

        function filtrarTalle(talle) {
            talleActual = talle;
            document.querySelectorAll('.size-filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderizarProductos();
        }

        function resetearFiltrosUI() {
            document.querySelectorAll('.subcat-btn').forEach((btn, idx) => {
                if (idx === 0) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            document.querySelectorAll('.size-filter-btn').forEach((btn, idx) => {
                if (idx === 0) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function renderizarProductos() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            const filtrados = productos.filter(p => {
                if (p.categoria !== categoriaPrincipalActual) return false;
                if (categoriaPrincipalActual === 'camisetas' && subcategoriaActual !== 'todas') {
                    if (p.version !== subcategoriaActual) return false;
                }
                if (talleActual !== 'todos' && !p.talles.includes(talleActual)) return false;
                return true;
            });

            filtrados.forEach(c => {
                const mensaje = `Hola! Me interesa ${c.nombre} (${c.version}). El precio publicado es de $${c.precio}. ¿Sigue disponible?`;
                const linkWp1 = `https://wa.me/${numero1}?text=${encodeURIComponent(mensaje)}`;
                const linkWp2 = `https://wa.me/${numero2}?text=${encodeURIComponent(mensaje)}`;
                const fotoPrincipal = c.imagenes[0];
                const cantidadFotos = c.imagenes.length;

                // Solo agregar "Por encargo" si NO es Versión Jugador
                const htmlPorEncargo = (c.version !== "Versión Jugador") 
                    ? `<div class="on-order">📌 Por encargo</div>` 
                    : ``;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper" onclick="abrirGaleria(${c.id})">
                        <img src="${fotoPrincipal}" alt="${c.nombre}">
                        <div class="photo-badge">📷 ${cantidadFotos} foto${cantidadFotos > 1 ? 's' : ''} (Ver)</div>
                    </div>
                    <div class="card-body">
                        <div class="title">${c.nombre}</div>
                        <div class="version">${c.version}</div>
                        <div class="price">$${c.precio.toLocaleString()}</div>
                        <div class="sizes">
                            ${c.talles.map(t => `<span class="size-badge">${t}</span>`).join('')}
                        </div>
                        ${htmlPorEncargo}
                        <div class="whatsapp-container">
                            <a href="${linkWp1}" target="_blank" class="whatsapp-btn">
                                💬 Pedir al WhatsApp 1
                            </a>
                            <a href="${linkWp2}" target="_blank" class="whatsapp-btn" style="background-color: #128C7E;">
                                💬 Pedir al WhatsApp 2
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirGaleria(idProducto) {
            const prod = productos.find(c => c.id === idProducto);
            if (!prod || !prod.imagenes.length) return;

            imagenesActuales = prod.imagenes;
            indiceFotoActual = 0;
            actualizarModal();
            document.getElementById('gallery-modal').classList.add('active');
        }

        function cerrarGaleria() {
            document.getElementById('gallery-modal').classList.remove('active');
        }

        function cambiarFoto(direccion) {
            indiceFotoActual += direccion;
            if (indiceFotoActual < 0) {
                indiceFotoActual = imagenesActuales.length - 1;
            } else if (indiceFotoActual >= imagenesActuales.length) {
                indiceFotoActual = 0;
            }
            actualizarModal();
        }

        function actualizarModal() {
            document.getElementById('modal-img').src = imagenesActuales[indiceFotoActual];
            document.getElementById('modal-counter').innerText = `${indiceFotoActual + 1} / ${imagenesActuales.length}`;
        }

        renderizarProductos();
    </script>
</body>
</html>
